name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'renderer/**'
      - 'src/**'
      - 'kb/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'renderer/**'
      - 'src/**'
      - 'kb/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install root dependencies
        run: npm install

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Build web assets
        working-directory: mobile
        run: node build-web.js

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahuva-it-support-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Rename APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ahuva-it-support.apk

      - name: Create or update release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (Latest Build)
          body: |
            Latest Android debug APK — built automatically from main.

            **Download the APK below and install on your Android phone.**

            Tap `ahuva-it-support.apk` under Assets to download directly.
          files: ahuva-it-support.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
