name: IP Finder APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ipfinder-android/**'
      - '.github/workflows/build-ipfinder.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ipfinder-android/**'
      - '.github/workflows/build-ipfinder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipfinder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ipfinder-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.IPFINDER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IPFINDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IPFINDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IPFINDER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "IPFINDER_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "IPFINDER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "IPFINDER_KEY_ALIAS=$KEY_ALIAS"
              echo "IPFINDER_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the IPFINDER_KEYSTORE_B64 secret"
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias ipfinder -keyalg RSA -keysize 3072 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Ahuva IP Finder, O=Ahuva Electronic Technologies Pvt. Ltd., C=IN"
            {
              echo "IPFINDER_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "IPFINDER_KEYSTORE_PASSWORD=$PASS"
              echo "IPFINDER_KEY_ALIAS=ipfinder"
              echo "IPFINDER_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "::warning::IPFINDER_KEYSTORE_B64 secret not set - signed with a one-off key, so this APK cannot update an install signed by a different build."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Lint
        run: |
          set +e
          ./gradlew --no-daemon lintRelease
          code=$?
          report=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          [ -f "$report" ] && cat "$report"
          exit $code

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ahuva-ip-finder.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs ahuva-ip-finder.apk | head -3
          ls -la ahuva-ip-finder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ahuva-ip-finder-apk
          path: ipfinder-android/ahuva-ip-finder.apk
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipfinder-lint-report
          path: ipfinder-android/app/build/reports/
          retention-days: 14

  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            arch: x86
            target: default
          - api: 29
            arch: x86_64
            target: default
          - api: 34
            arch: x86_64
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ahuva-ip-finder-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ipfinder-android/scripts/emulator-smoke.sh ahuva-ip-finder.apk api${{ matrix.api }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipfinder-smoke-api${{ matrix.api }}
          path: smoke-api${{ matrix.api }}/
          retention-days: 14

  release:
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ahuva-ip-finder-apk

      - name: Replace previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ipfinder-latest --yes --cleanup-tag 2>/dev/null || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ipfinder-latest
          name: "Ahuva IP Finder - Android APK (build ${{ github.run_number }})"
          body: |
            ## Ahuva IP Finder for Android

            **Direct download:** `ahuva-ip-finder.apk` below.

            Scans your Wi-Fi, Ethernet, hotspot or VPN network and lists every device with its name, IP, MAC address,
            manufacturer, device type and open services, then opens each service in the right app.

            - Fast parallel scan (ICMP + TCP), NetBIOS, mDNS/Bonjour, UPnP/SSDP, reverse DNS
            - Open HTTP/HTTPS, SSH, Telnet, RDP, VNC, FTP, SMB, RTSP in any installed app
            - Full port scanner, ping, traceroute, Wake-on-LAN, DNS lookup, subnet calculator
            - Favorites, rename, notes, NEW-device badges, CSV/HTML/JSON export
            - Android 5.0+ on every phone, tablet and Chromebook; 100% offline, no tracking

            Tested on Android 5.0 (API 21), 10 (API 29) and 14 (API 34) emulators in CI.
          files: ahuva-ip-finder.apk
          make_latest: false
