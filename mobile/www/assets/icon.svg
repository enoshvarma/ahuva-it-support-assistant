<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep navy to near-black -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050a10"/>
    </radialGradient>
    <!-- Cyan glow for the A -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle outer glow on the border -->
    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Metallic gradient for the A letterform -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8f4fd"/>
      <stop offset="30%"  stop-color="#a8d8f0"/>
      <stop offset="60%"  stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <!-- Circuit-trace cyan -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0096c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Outer border ring with cyan glow -->
  <rect x="10" y="10" width="492" height="492" rx="88" ry="88"
        fill="none" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.5" filter="url(#borderGlow)"/>

  <!-- ── Circuit board traces (background decoration) ── -->
  <!-- horizontal traces -->
  <line x1="56"  y1="100" x2="130" y2="100" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="382" y1="100" x2="456" y2="100" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="56"  y1="412" x2="130" y2="412" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="382" y1="412" x2="456" y2="412" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <!-- vertical traces -->
  <line x1="100" y1="56"  x2="100" y2="130" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="412" y1="56"  x2="412" y2="130" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="100" y1="382" x2="100" y2="456" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="412" y1="382" x2="412" y2="456" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.18"/>
  <!-- corner dots -->
  <circle cx="100" cy="100" r="4" fill="#00d4ff" fill-opacity="0.35"/>
  <circle cx="412" cy="100" r="4" fill="#00d4ff" fill-opacity="0.35"/>
  <circle cx="100" cy="412" r="4" fill="#00d4ff" fill-opacity="0.35"/>
  <circle cx="412" cy="412" r="4" fill="#00d4ff" fill-opacity="0.35"/>

  <!-- extra inner circuit dots -->
  <circle cx="180" cy="68"  r="2.5" fill="#00d4ff" fill-opacity="0.25"/>
  <circle cx="332" cy="68"  r="2.5" fill="#00d4ff" fill-opacity="0.25"/>
  <circle cx="180" cy="444" r="2.5" fill="#00d4ff" fill-opacity="0.25"/>
  <circle cx="332" cy="444" r="2.5" fill="#00d4ff" fill-opacity="0.25"/>
  <line x1="180" y1="68"  x2="332" y2="68"  stroke="#00d4ff" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="180" y1="444" x2="332" y2="444" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- ── The "A" monogram ── -->
  <!-- Drawn as a custom path: wide tech/geometric A centered at 256,270 -->
  <!-- Legs spread: left foot ~116,380  right foot ~396,380  apex ~256,108 -->
  <g filter="url(#glow)">
    <!-- left stroke of A -->
    <polygon
      points="256,108  196,380  148,380  220,180"
      fill="url(#metalGrad)"
      stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.7"
    />
    <!-- right stroke of A (mirror) -->
    <polygon
      points="256,108  316,380  364,380  292,180"
      fill="url(#metalGrad)"
      stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.7"
    />
    <!-- crossbar -->
    <rect x="183" y="262" width="146" height="38" rx="4"
          fill="url(#metalGrad)"
          stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- crossbar cutout to expose gap in middle of A -->
    <!-- apex fill triangle (clean up the top join) -->
    <polygon
      points="256,115  228,192  284,192"
      fill="url(#bgGrad)"
    />
    <!-- interior triangle above crossbar -->
    <polygon
      points="256,200  216,258  296,258"
      fill="#050a10"
      fill-opacity="0.9"
    />
    <!-- interior triangle below crossbar -->
    <polygon
      points="222,304  161,372  185,372  234,304"
      fill="#050a10"
      fill-opacity="0.9"
    />
    <polygon
      points="290,304  351,372  375,372  326,304"
      fill="#050a10"
      fill-opacity="0.9"
    />
  </g>

  <!-- ── "AHUVA" wordmark below the big A ── -->
  <text
    x="256" y="440"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="52"
    letter-spacing="10"
    fill="#00b4d8"
    fill-opacity="0.85"
  >AHUVA</text>

  <!-- ── Subtle bottom tagline ── -->
  <text
    x="256" y="470"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="16"
    letter-spacing="3"
    fill="#4fc3f7"
    fill-opacity="0.5"
  >ELEVATING TECH</text>
</svg>
