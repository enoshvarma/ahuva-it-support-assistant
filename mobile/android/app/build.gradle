apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Same version as the desktop app; CI supplies an ever-increasing build number.
def appVersionName = new JsonSlurper().parse(rootProject.file('../../package.json')).version
def appVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
def releaseKeystore = System.getenv("KEYSTORE_FILE")

android {
    namespace "com.ahuva.itsupport"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ahuva.itsupport"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "SELFTEST", "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "ahuva"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Local builds without a keystore fall back to the debug key so the APK still installs.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        // Byte-for-byte the release configuration plus the CI self-test hook; never published.
        selftest {
            initWith release
            buildConfigField "boolean", "SELFTEST", "true"
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    testOptions {
        unitTests.all {
            testLogging { events "passed", "failed", "skipped"; exceptionFormat "full" }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.github.mwiede:jsch:0.2.18'
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.apache.sshd:sshd-core:2.12.1'
    testImplementation 'org.slf4j:slf4j-nop:1.7.36'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
