plugins {
    id 'com.android.application'
}

// CI passes an ever-increasing build number so every APK installs over the previous one.
def appVersionCode = (System.getenv("SARATHI_VERSION_CODE") ?: "1").toInteger()
def releaseKeystore = System.getenv("SARATHI_KEYSTORE_FILE") ?: "sarathi-ci.keystore"

android {
    namespace 'com.projectsarathi.gpscamera'
    compileSdk 35

    defaultConfig {
        applicationId 'com.projectsarathi.gpscamera'
        // Android 5.0 (Lollipop) and every newer version.
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName "1.0." + appVersionCode
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file(releaseKeystore)
            storePassword System.getenv("SARATHI_KEYSTORE_PASSWORD") ?: "sarathi-ci"
            keyAlias System.getenv("SARATHI_KEY_ALIAS") ?: "sarathi"
            keyPassword System.getenv("SARATHI_KEY_PASSWORD") ?: (System.getenv("SARATHI_KEYSTORE_PASSWORD") ?: "sarathi-ci")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.13.2'
}
